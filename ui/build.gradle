plugins {
    id 'base'
    id 'com.github.node-gradle.node'
}

node {
    version = '18.17.0'
    npmVersion = '9.6.7'
    download = true
    workDir = file("${project.buildDir}/nodejs")
    nodeProjectDir = file("${project.projectDir}")
}

//task npmInstall(type: NpmTask) {
//    description = '安装前端依赖'
//    args = ['install']
//}

task buildUI(type: NpmTask, dependsOn: npmInstall) {
    description = '构建前端项目'
    args = ['run', 'build']
}

task devUI(type: NpmTask, dependsOn: npmInstall) {
    description = '启动前端开发服务器'
    args = ['run', 'dev']
}

task devElectron(type: NpmTask, dependsOn: npmInstall) {
    description = '启动 Electron 开发模式（包含 Vite 服务器和 Electron 应用）'
    args = ['run', 'electron-dev']
}

task buildElectron(type: NpmTask, dependsOn: npmInstall) {
    description = '构建 Electron 桌面应用程序（生成 exe 安装包）'
    args = ['run', 'build:electron']
}

task buildElectronWin(type: NpmTask, dependsOn: npmInstall) {
    description = '构建 Windows 平台 Electron 应用（生成 exe 和安装程序）'
    args = ['run', 'build:win']
}

task distElectronWin(type: NpmTask, dependsOn: npmInstall) {
    description = '打包 Windows 发行版（包含 NSIS 安装程序和便携版）'
    args = ['run', 'dist:win']
}

task packElectron(type: NpmTask, dependsOn: npmInstall) {
    description = '构建未打包的 Electron 应用以供测试'
    args = ['run', 'electron-pack']
}

task buildAndRunElectron(type: NpmTask, dependsOn: npmInstall) {
    description = '构建并运行 Electron 桌面应用程序'
    group = 'run'
    args = ['run', 'start:pack']
}
task cleanUI(type: Delete) {
    delete 'dist', 'dist-electron', 'node_modules/.cache'
}

clean.dependsOn cleanUI
build.dependsOn buildUI
