<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="msgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" stroke="#1D4ED8" stroke-width="4"/>

  <!-- 消息气泡1 -->
  <path d="M60 90 Q50 80 50 90 L50 120 Q50 130 60 130 L110 130 Q120 130 120 120 L120 100 Q120 90 110 90 L80 90 L70 100 Z"
        fill="url(#msgGradient)" opacity="0.9"/>

  <!-- 消息气泡2 -->
  <path d="M100 140 Q90 130 90 140 L90 170 Q90 180 100 180 L160 180 Q170 180 170 170 L170 150 Q170 140 160 140 L130 140 L120 150 Z"
        fill="url(#msgGradient)" opacity="0.8"/>

  <!-- 消息气泡3 -->
  <path d="M140 100 Q130 90 130 100 L130 130 Q130 140 140 140 L190 140 Q200 140 200 130 L200 110 Q200 100 190 100 L170 100 L160 110 Z"
        fill="url(#msgGradient)" opacity="0.7"/>

  <!-- TeleMsg 文字标识 -->
  <text x="128" y="220" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">TeleMsg</text>

  <!-- 装饰性元素 - 连接线 -->
  <circle cx="80" cy="105" r="3" fill="#60A5FA"/>
  <circle cx="130" cy="155" r="3" fill="#60A5FA"/>
  <circle cx="170" cy="115" r="3" fill="#60A5FA"/>

  <!-- 阴影效果 -->
  <circle cx="132" cy="132" r="120" fill="none" stroke="#000000" stroke-width="2" opacity="0.1"/>
</svg>

